<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Project Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase JS Client v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #141413;
    --card: #1c1c1a;
    --card-inner: #242320;
    --border: #3b3935;
    --border-subtle: #2d2c28;
    --text-main: #edeae2;
    --text-muted: #969186;
    --cue: #e05344;
    --cue-glow: rgba(224, 83, 68, 0.15);
    --tag-deck: #7ea3a6;
    --highlight: #282620;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app-container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  .brand {
    font-family: 'Poppins', sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand span {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 8px;
  }
  .auth-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    background: transparent;
    color: var(--text-main);
    border: 1.5px solid var(--border);
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .auth-btn:hover {
    background: var(--card-inner);
    border-color: var(--text-muted);
  }
  .auth-btn.active {
    background: var(--cue);
    color: #fff;
    border-color: var(--cue);
  }

  /* Stage Box: BREAK | Clock | Speaker + Controls */
  .stage-box {
    border: 2px solid var(--border);
    background: var(--card);
    position: relative;
    padding-top: 14px;
    border-radius: 4px;
  }
  .break-tag {
    position: absolute;
    top: -11px;
    left: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 8px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }
  .stage-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 2px solid var(--border);
  }
  .timer-col {
    padding: 24px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 2px solid var(--border);
    background: var(--card-inner);
  }
  #clock {
    font-family: 'Space Mono', monospace;
    font-size: clamp(2.4rem, 7vw, 3.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  #clock.warn {
    color: var(--cue);
    text-shadow: 0 0 16px var(--cue-glow);
  }

  .speaker-col {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }
  .speaker-meta {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--cue);
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  #speaker-name {
    font-family: 'Poppins', sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }
  #speaker-name.empty {
    font-style: italic;
    color: var(--text-muted);
    font-weight: 400;
  }
  .controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn-transport {
    font-family: 'Space Mono', monospace;
    background: var(--card-inner);
    color: var(--text-main);
    border: 1.5px solid var(--border);
    height: 38px;
    min-width: 42px;
    cursor: pointer;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .btn-transport:hover {
    background: var(--border);
    border-color: var(--text-muted);
  }
  .btn-transport:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Ledger Queue */
  .ledger {
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: 4px;
  }
  .ledger-title {
    padding: 10px 14px;
    border-bottom: 1.5px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
  }
  .q-row {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .q-row:last-child { border-bottom: none; }
  .q-row.active-speaker { background: var(--highlight); }
  .q-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.88rem;
    color: var(--text-muted);
  }
  .q-row.active-speaker .q-num { color: var(--cue); font-weight: 700; }
  .q-details { display: flex; flex-direction: column; }
  .q-name { font-size: 0.95rem; font-weight: 500; }
  .q-sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }
  .q-sub.on-deck { color: var(--tag-deck); font-weight: 700; }
  .q-sub.on-stage { color: var(--cue); font-weight: 700; }

  .q-actions { display: flex; gap: 4px; }
  .q-actions button {
    border: 1px solid var(--border);
    background: var(--card-inner);
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 3px;
  }
  .q-actions button:hover {
    color: var(--text-main);
    border-color: var(--text-muted);
  }
  .q-actions button.danger:hover {
    color: var(--cue);
    border-color: var(--cue);
  }
  .empty-state {
    padding: 28px 14px;
    font-style: italic;
    color: var(--text-muted);
    font-size: 0.9rem;
    text-align: center;
  }

  /* Admin Add Form */
  .admin-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  .form-row input {
    font-family: 'Poppins', sans-serif;
    border: 1.5px solid var(--border);
    padding: 10px 12px;
    background: var(--card);
    color: var(--text-main);
    font-size: 0.9rem;
    flex: 1;
    border-radius: 4px;
    outline: none;
  }
  .form-row input:focus {
    border-color: var(--text-muted);
  }
  .form-row button {
    font-family: 'Space Mono', monospace;
    background: var(--card-inner);
    color: var(--text-main);
    border: 1.5px solid var(--border);
    padding: 0 18px;
    cursor: pointer;
    font-weight: 700;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .form-row button:hover {
    background: var(--text-main);
    color: var(--bg);
    border-color: var(--text-main);
  }

  /* Visibility toggles */
  [data-admin-only] { display: none !important; }
  body.admin-mode [data-admin-only] { display: flex !important; }
  body.admin-mode .q-actions[data-admin-only] { display: flex !important; }

  @media (max-width: 540px) {
    .stage-grid { grid-template-columns: 1fr; }
    .timer-col { border-right: none; border-bottom: 2px solid var(--border); padding: 18px; }
    .form-row { flex-direction: column; }
    .form-row button { padding: 10px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand">Call Sheet <span>live queue</span></div>
    <button id="auth-btn" class="auth-btn" type="button">Admin Login</button>
  </header>

  <!-- Stage Box -->
  <section class="stage-box" aria-label="Current Presenter and Timer">
    <div class="break-tag">BREAK</div>
    <div class="stage-grid">
      <div class="timer-col">
        <div id="clock">03:00</div>
      </div>
      <div class="speaker-col">
        <div>
          <div class="speaker-meta">ON STAGE</div>
          <div id="speaker-name" class="empty">Queue is empty</div>
        </div>
        
        <!-- Admin Transport Controls -->
        <div class="controls-row" data-admin-only>
          <button id="btn-play-pause" class="btn-transport" title="Start/Pause">▷</button>
          <button id="btn-reset" class="btn-transport" title="Reset Current">↺</button>
          <button id="btn-next" class="btn-transport" title="Next Presenter">▶▶</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Running Order Ledger -->
  <section class="ledger" aria-label="Queue list">
    <div class="ledger-title">
      <span>RUNNING ORDER</span>
      <span id="queue-count">0 PRESENTERS</span>
    </div>
    <div id="queue-rows"></div>
  </section>

  <!-- Admin Add Presenter -->
  <section class="admin-panel" data-admin-only>
    <form id="add-form" class="form-row">
      <input id="in-name" type="text" placeholder="Presenter Name" required autocomplete="off">
      <input id="in-email" type="email" placeholder="Email (notifies on-deck)" autocomplete="off">
      <button type="submit">Enqueue</button>
    </form>
  </section>
</div>

<script>
  const SUPABASE_URL = "https://cqpvpuwienybitwvfchu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxcHZwdXdpZW55Yml0d3ZmY2h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MjE4OTQsImV4cCI6MjA5NDk5Nzg5NH0.DwoNfG1aVyMFgsPIUQfHmLn5ajCiC6bBj4fU8o_LOQY";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let queue = [];
  let timer = { duration_seconds: 180, remaining_seconds: 180, running: false, ends_at: null };
  let currentUser = null;

  // DOM elements
  const clockEl = document.getElementById('clock');
  const speakerNameEl = document.getElementById('speaker-name');
  const queueRowsEl = document.getElementById('queue-rows');
  const queueCountEl = document.getElementById('queue-count');
  const authBtn = document.getElementById('auth-btn');
  const playPauseBtn = document.getElementById('btn-play-pause');
  const resetBtn = document.getElementById('btn-reset');
  const nextBtn = document.getElementById('btn-next');
  const addForm = document.getElementById('add-form');

  function fmt(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const rem = (s % 60).toString().padStart(2, '0');
    return `${m}:${rem}`;
  }

  function renderQueue() {
    queueRowsEl.innerHTML = '';
    queueCountEl.textContent = `${queue.length} PRESENTER${queue.length === 1 ? '' : 'S'}`;

    if (queue.length === 0) {
      speakerNameEl.textContent = 'Queue is empty';
      speakerNameEl.classList.add('empty');
      queueRowsEl.innerHTML = `<div class="empty-state">No presenters lined up.</div>`;
      return;
    }

    speakerNameEl.textContent = queue[0].name;
    speakerNameEl.classList.remove('empty');

    queue.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'q-row' + (idx === 0 ? ' active-speaker' : '');

      const tagText = idx === 0 ? 'ON STAGE' : idx === 1 ? 'ON DECK (NOTIFIED)' : '';
      const tagClass = idx === 0 ? 'q-sub on-stage' : (idx === 1 ? 'q-sub on-deck' : 'q-sub');

      row.innerHTML = `
        <div class="q-num">${String(idx + 1).padStart(2, '0')}</div>
        <div class="q-details">
          <span class="q-name">${item.name}</span>
          ${tagText ? `<span class="${tagClass}">${tagText}</span>` : ''}
        </div>
        <div class="q-actions" data-admin-only>
          ${idx > 0 ? `<button type="button" onclick="moveQueue(${idx}, -1)" title="Move up">↑</button>` : ''}
          ${idx < queue.length - 1 ? `<button type="button" onclick="moveQueue(${idx}, 1)" title="Move down">↓</button>` : ''}
          <button type="button" class="danger" onclick="removeQueue('${item.id}')" title="Remove">✕</button>
        </div>
      `;
      queueRowsEl.appendChild(row);
    });

    if (currentUser) {
      document.querySelectorAll('.q-actions').forEach(el => el.style.display = 'flex');
    }
  }

  function renderClock() {
    let curSec = timer.remaining_seconds;
    if (timer.running && timer.ends_at) {
      const diff = Math.round((new Date(timer.ends_at).getTime() - Date.now()) / 1000);
      curSec = Math.max(0, diff);
    }
    clockEl.textContent = fmt(curSec);
    clockEl.classList.toggle('warn', curSec <= 30 && curSec > 0);
    playPauseBtn.textContent = timer.running ? '❚❚' : '▷';

    if (timer.running && curSec === 0) {
      sb.rpc('advance_queue');
    }
  }

  // --- Realtime & DB Sync ---
  async function loadInitialData() {
    const { data: q } = await sb.from('queue').select('*').order('position', { ascending: true });
    if (q) queue = q;

    const { data: t } = await sb.from('timer_state').select('*').eq('id', 1).single();
    if (t) timer = t;

    renderQueue();
    renderClock();
  }

  function setupRealtime() {
    sb.channel('callsheet_sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, async () => {
        const { data } = await sb.from('queue').select('*').order('position', { ascending: true });
        if (data) { queue = data; renderQueue(); }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'timer_state' }, (payload) => {
        if (payload.new) {
          timer = payload.new;
          renderClock();
        }
      })
      .subscribe();
  }

  // --- Controls ---
  playPauseBtn.addEventListener('click', async () => {
    if (queue.length === 0) return;
    const isRunning = !timer.running;
    let endsAt = null;

    if (isRunning) {
      const remaining = timer.remaining_seconds > 0 ? timer.remaining_seconds : timer.duration_seconds;
      endsAt = new Date(Date.now() + remaining * 1000).toISOString();
    }

    await sb.from('timer_state').update({
      running: isRunning,
      ends_at: endsAt,
      updated_at: new Date().toISOString()
    }).eq('id', 1);
  });

  resetBtn.addEventListener('click', async () => {
    await sb.from('timer_state').update({
      running: false,
      remaining_seconds: timer.duration_seconds,
      ends_at: null,
      updated_at: new Date().toISOString()
    }).eq('id', 1);
  });

  nextBtn.addEventListener('click', async () => {
    await sb.rpc('advance_queue');
  });

  window.moveQueue = async function(index, direction) {
    const target = index + direction;
    if (target < 0 || target >= queue.length) return;
    const a = queue[index];
    const b = queue[target];

    await sb.from('queue').upsert([
      { id: a.id, position: b.position },
      { id: b.id, position: a.position }
    ]);
  };

  window.removeQueue = async function(id) {
    await sb.from('queue').delete().eq('id', id);
  };

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('in-name').value.trim();
    const email = document.getElementById('in-email').value.trim() || null;
    const nextPos = queue.length > 0 ? Math.max(...queue.map(q => q.position)) + 1 : 1;

    await sb.from('queue').insert({ name, notify_email: email, position: nextPos });
    addForm.reset();
  });

  // --- Auth ---
  authBtn.addEventListener('click', async () => {
    if (currentUser) {
      await sb.auth.signOut();
      setAuth(null);
    } else {
      const email = prompt("Admin Email:");
      const password = prompt("Admin Password:");
      if (!email || !password) return;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else setAuth(data.user);
    }
  });

  function setAuth(user) {
    currentUser = user;
    document.body.classList.toggle('admin-mode', !!user);
    authBtn.textContent = user ? 'Logout' : 'Admin Login';
    authBtn.classList.toggle('active', !!user);
    renderQueue();
  }

  setInterval(renderClock, 500);
  sb.auth.getUser().then(({ data }) => setAuth(data.user));
  loadInitialData();
  setupRealtime();
</script>
</body>
</html>
